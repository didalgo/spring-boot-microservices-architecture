server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      # Global CORS Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      
      # Routes Configuration
      routes:
        # Order Service Routes
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders/**
        
        # Payment Service Routes
        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/payments/**
        
        # Notification Service Routes
        - id: notification-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/notifications/**
      
      # Default Filters (applied to all routes)
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
            methods: GET
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: true

# Logging
logging:
  level:
    root: INFO
    com.idalgo.daniel.apigateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
