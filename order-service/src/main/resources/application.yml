spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Enable observation for tracing
        spring.kafka.observation.enabled: true
      
server:
  port: 8081

# Order Service specific configuration
order-service:
  max-orders-per-customer: 100
  order-prefix: "ORD"
  enable-notifications: false

# Logging configuration
logging:
  level:
    root: INFO
    com.idalgo.daniel.orderservice: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"    
 
# Payment Service Configuration
payment-service:
  name: payment-service

# Eureka Client Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 30
    leaseExpirationDurationInSeconds: 90

# Distributed Tracing
management:
  tracing:
    sampling:
      probability: 1.0  # 100% for development
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  observations:
    http:
      client:
        enabled: true
