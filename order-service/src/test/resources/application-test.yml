spring:
  application:
    name: order-service-test

# Test-specific configuration
order-service:
  max-orders-per-customer: 50
  order-prefix: "TEST"
  enable-notifications: false

# Disable unnecessary logging in tests
logging:
  level:
    root: WARN
    com.idalgo.daniel.orderservice: INFO

# Disable Eureka in tests
eureka:
  client:
    enabled: false

# Disable Zipkin in tests
management:
  tracing:
    enabled: false
  zipkin:
    tracing:
      enabled: false

payment-service:
  name: payment-service