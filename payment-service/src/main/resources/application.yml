spring:
  application:
    name: payment-service

server:
  port: 8082

# Payment Service specific configuration
payment-service:
  payment-prefix: "PAY"
  enable-fraud-detection: false
  max-refund-days: 30

# Logging configuration
logging:
  level:
    root: INFO
    com.idalgo.daniel.paymentservice: DEBUG
    com.idalgo.daniel.common: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
    
# Eureka Client Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 30
    leaseExpirationDurationInSeconds: 90

# Distributed Tracing
management:
  tracing:
    sampling:
      probability: 1.0  # 100% for development
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

